<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日本購物指南</title>
  <meta name="description" content="依種類、品牌和都道府縣找日本商店。地址、Google 地圖、營業時間與官網分店列表。" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+TC:wght@400;500&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#fff; --ink:#1a1a1a; --muted:#5c5c5c; --faint:#8a8a8a; --line:#e6e6e6; --card:#fff; --accent:#1f3a34; --fg:#fff; }
    html[data-theme="dark"] { color-scheme: dark; --paper:#141414; --ink:#f5f5f5; --muted:#c8c8c8; --faint:#9a9a9a; --line:#3a3a3a; --card:#1c1c1c; --accent:#d7efe6; --fg:#10211c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "M PLUS Rounded 1c", "Zen Maru Gothic", "Noto Sans TC", sans-serif; }
    button, select, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .bar { height: 4px; background: var(--accent); }
    header, main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; }
    .kicker { letter-spacing: .04em; font-size: 12px; color: var(--muted); margin: 0; }
    h1, h2, .name { font-family: "Zen Maru Gothic", "M PLUS Rounded 1c", "Noto Sans TC", sans-serif; }
    h1 { font-size: 40px; line-height: 1.2; margin: 4px 0; font-weight: 700; }
    .lead, .note { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .modes { display: flex; gap: 8px; }
    .mode { min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .mode.on { background: var(--accent); color: var(--fg); border-color: var(--accent); }
    .layout { display: grid; gap: 28px; min-width: 0; }
    @media (min-width: 960px) { .layout { grid-template-columns: 280px 1fr; align-items: start; } aside { position: sticky; top: 0; } }
    aside, section, fieldset, .row { min-width: 0; max-width: 100%; }
    label, legend { font-size: 12px; color: var(--muted); }
    fieldset { border: 0; margin: 16px 0 0; padding: 0; min-width: 0; }
    .row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .chip, .toggle, select, input[type="search"] { min-height: 44px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; }
    .chip { flex: 0 0 auto; padding: 8px 12px; }
    .chip.on, .toggle.on { background: var(--accent); color: var(--fg); border-color: var(--accent); }
    select, input[type="search"], .toggle { border-radius: 8px; width: 100%; padding: 8px 12px; }
    .toggle { text-align: left; margin-top: 8px; }
    .count { color: var(--faint); margin-left: 4px; }
    .chip.on .count { color: var(--fg); }
    .meta { color: var(--muted); font-size: 12px; }
    .name { font-size: 22px; margin: 4px 0; font-weight: 700; }
    .mark { width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; flex: 0 0 auto; }
    .store { width: 100%; display: flex; gap: 12px; align-items: flex-start; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 14px 0; color: var(--ink); }
    .fav { min-width: 44px; min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .fav.on { background: var(--accent); color: var(--fg); border-color: var(--accent); }
    .tone-fashion { color: #8e3550; } .mark-fashion { background: #8e3550; }
    .tone-living { color: #176b45; } .mark-living { background: #176b45; }
    .tone-hundred { color: #8a5a10; } .mark-hundred { background: #8a5a10; }
    .tone-select { color: #5c4588; } .mark-select { background: #5c4588; }
    .tone-appliance { color: #1a568c; } .mark-appliance { background: #1a568c; }
    .tone-drugstore { color: #0d6e68; } .mark-drugstore { background: #0d6e68; }
    .tone-character { color: #a84868; } .mark-character { background: #a84868; }
    .tone-food { color: #b14a14; } .mark-food { background: #b14a14; }
    .tone-books { color: #6d5130; } .mark-books { background: #6d5130; }
    .tone-stationery { color: #34528c; } .mark-stationery { background: #34528c; }
    .tone-arcade { color: #5e3488; } .mark-arcade { background: #5e3488; }
    .tone-mall { color: #2f5e6a; } .mark-mall { background: #2f5e6a; }
    .tone-discount { color: #8e3333; } .mark-discount { background: #8e3333; }
    .tone-other { color: #1a1a1a; } .mark-other { background: #3d3d3d; }
    html[data-theme="dark"] .tone-fashion { color: #f3b0c2; }
    html[data-theme="dark"] .tone-living { color: #8ee0bf; }
    html[data-theme="dark"] .tone-hundred { color: #f0c57a; }
    html[data-theme="dark"] .tone-select { color: #d4c0f0; }
    html[data-theme="dark"] .tone-appliance { color: #9ec8f0; }
    html[data-theme="dark"] .tone-drugstore { color: #8edcd4; }
    html[data-theme="dark"] .tone-character { color: #f3b4c8; }
    html[data-theme="dark"] .tone-food { color: #f3b48a; }
    html[data-theme="dark"] .tone-books { color: #e2c4a0; }
    html[data-theme="dark"] .tone-stationery { color: #b4c8f0; }
    html[data-theme="dark"] .tone-arcade { color: #d4b4f0; }
    html[data-theme="dark"] .tone-mall { color: #a8d0d8; }
    html[data-theme="dark"] .tone-discount { color: #f0b0b0; }
    html[data-theme="dark"] .tone-other { color: #f5f5f5; }
    .open { color: #147a32; }
    .closed { color: #c4342d; }
    html[data-theme="dark"] .open { color: #7ddea0; }
    html[data-theme="dark"] .closed { color: #ff8d86; }
    h2 { font-size: 28px; margin: 28px 0 0; font-weight: 700; }
    .hint { margin: 12px 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
    .hint a { display: flex; min-height: 44px; align-items: center; justify-content: center; margin-top: 8px; border-radius: 8px; background: var(--accent); color: var(--fg); text-decoration: none; }
    .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; justify-content: flex-end; }
    .panel { background: var(--card); color: var(--ink); width: min(440px, 100%); height: 100%; overflow: auto; padding: 20px; }
    .links { display: grid; gap: 8px; margin-top: 16px; }
    .links a, .links button { min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); text-decoration: none; }
    .links a.primary { background: var(--accent); color: var(--fg); border-color: var(--accent); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="bar"></div>
  <header>
    <div class="top">
      <div>
        <p class="kicker">JAPAN SHOPPING GUIDE</p>
        <h1>日本購物指南</h1>
        <p class="lead">依種類、品牌和都道府縣找店。這是靜態頁，用瀏覽器就能開。收錄 <span id="total"></span> 間主要分店，不是全國每一間。</p>
      </div>
      <div class="modes" role="group" aria-label="外觀">
        <button id="mode-light" class="mode on" type="button">白色</button>
        <button id="mode-dark" class="mode" type="button">黑暗</button>
      </div>
    </div>
  </header>
  <main class="layout">
    <aside>
      <label for="q">搜尋</label>
      <input id="q" type="search" placeholder="店名、地址、車站" />
      <label for="pref">都道府縣（北海道 → 沖繩）</label>
      <select id="pref"></select>
      <fieldset>
        <legend>種類 · 左右滑動</legend>
        <div id="cats" class="row"></div>
      </fieldset>
      <fieldset>
        <legend>品牌 · 左右滑動</legend>
        <div id="brands" class="row"></div>
      </fieldset>
      <button id="open" class="toggle" type="button">現在營業中</button>
      <button id="saved" class="toggle" type="button">我的最愛</button>
      <p class="note">日本時間 <span id="clock">—</span>。營業中以東京時間計算。時間會改，出門前看官網。</p>
    </aside>
    <section>
      <p class="meta"><span id="shown">0</span> 間</p>
      <div id="hint" class="hint hidden"></div>
      <div id="list"></div>
    </section>
  </main>
  <div id="sheet" class="sheet hidden"></div>

  <script>
    const DATA = JSON.parse(document.getElementById("payload").textContent);
    const brands = Object.fromEntries(DATA.brands.map((b) => [b.id, b]));
    const prefs = Object.fromEntries(DATA.prefs.map((p) => [p.code, p.zh]));
    const catLabel = Object.fromEntries(DATA.categories.map((c) => [c.id, c.zh]));
    const state = { q: "", pref: "", cats: new Set(), brands: new Set(), open: false, saved: false };
    let favs = new Set();
    try { favs = new Set(JSON.parse(localStorage.getItem("joukyucho-fav") || "[]")); } catch (e) { favs = new Set(); }
    function saveFavs() {
      try { localStorage.setItem("joukyucho-fav", JSON.stringify([...favs])); } catch (e) {}
    }
    function letters(store) {
      const en = ((brands[store.brandId] || {}).en || "").replace(/[^A-Za-z0-9]/g, "");
      if (en.length >= 2) return en.slice(0, 2).toUpperCase();
      if (en.length === 1) return en.toUpperCase();
      return [...brandName(store)][0] || "店";
    }
    function toneOf(store) {
      const id = (brands[store.brandId] || {}).category || "other";
      return ["fashion","living","hundred","select","appliance","drugstore","character","food","books","stationery","arcade","mall","discount"].indexOf(id) >= 0 ? id : "other";
    }
    const DAYS = ["mon","tue","wed","thu","fri","sat","sun"];
    const DAY = { mon:"一", tue:"二", wed:"三", thu:"四", fri:"五", sat:"六", sun:"日" };
    const WEEK = { Mon:"mon", Tue:"tue", Wed:"wed", Thu:"thu", Fri:"fri", Sat:"sat", Sun:"sun" };

    function jst(date) {
      const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone:"Asia/Tokyo", weekday:"short", hour:"2-digit", minute:"2-digit", hourCycle:"h23" }).formatToParts(date).map((p) => [p.type, p.value]));
      const hour = parts.hour === "24" ? 0 : Number(parts.hour);
      return { key: WEEK[parts.weekday] || "mon", minutes: hour * 60 + Number(parts.minute), label: String(hour).padStart(2,"0") + ":" + parts.minute };
    }
    function mins(hhmm) { const [h,m] = hhmm.split(":").map(Number); return h * 60 + m; }
    function contains(now, span) {
      const open = mins(span.open), close = mins(span.close);
      if (close === open) return true;
      if (close > open) return now >= open && now < close;
      return now >= open || now < close;
    }
    function openState(hours, now) {
      if (hours.kind === "unknown") return "unknown";
      if (hours.kind === "24h") return "open";
      const span = hours.kind === "daily" ? hours : hours.days[now.key];
      if (!span) return "closed";
      return contains(now.minutes, span) ? "open" : "closed";
    }
    function summary(hours) {
      if (hours.kind === "24h") return "24 小時";
      if (hours.kind === "unknown") return "時間未收錄";
      const label = (span) => mins(span.close) <= mins(span.open) ? span.open + "–翌日 " + span.close : span.open + "–" + span.close;
      if (hours.kind === "daily") return "每日 " + label(hours);
      const groups = [];
      for (const day of DAYS) {
        const span = hours.days[day];
        const text = span ? label(span) : "休息";
        const last = groups[groups.length - 1];
        if (last && last.text === text) last.end = day;
        else groups.push({ start: day, end: day, text });
      }
      return groups.map((g) => (g.start === g.end ? "週" + DAY[g.start] : "週" + DAY[g.start] + "至" + DAY[g.end]) + " " + g.text).join(" · ");
    }
    function brandName(store) {
      return store.brandLabel || (brands[store.brandId] && brands[store.brandId].zh) || "其他";
    }
    function hay(store) {
      const b = brands[store.brandId] || {};
      return [store.nameJa, store.nameZh, store.address, store.city, store.station, store.brandLabel, b.zh, b.ja, b.en, catLabel[b.category], prefs[store.prefCode]].filter(Boolean).join(" ").toLowerCase();
    }
    function groupId(cat) {
      const found = DATA.groups.find((group) => group.match.indexOf(cat) >= 0);
      return found ? found.id : "other";
    }
    function match(store, now) {
      if (state.pref && store.prefCode !== state.pref) return false;
      if (state.cats.size && !state.cats.has(groupId((brands[store.brandId] || {}).category))) return false;
      if (state.brands.size && !state.brands.has(store.brandId)) return false;
      if (state.q && !state.q.split(/\s+/).every((part) => hay(store).includes(part))) return false;
      if (state.open && openState(store.hours, now) !== "open") return false;
      if (state.saved && !favs.has(store.id)) return false;
      return true;
    }
    function maps(store) {
      return "https://www.google.co.jp/maps/search/?api=1&query=" + encodeURIComponent(store.nameJa + " " + store.address) + "&hl=ja";
    }
    function japanQuery(brand, prefCode) {
      const place = (DATA.prefs.find((item) => item.code === prefCode) || {}).ja || "日本";
      return "https://www.google.co.jp/maps/search/?api=1&query=" + encodeURIComponent(((brand && (brand.ja || brand.zh)) || "") + " " + place) + "&hl=ja";
    }
    function source(store) {
      return (brands[store.brandId] && brands[store.brandId].finder) || store.url || "";
    }

    const q = document.getElementById("q");
    const pref = document.getElementById("pref");
    const list = document.getElementById("list");
    const sheet = document.getElementById("sheet");
    document.getElementById("total").textContent = String(DATA.stores.length);
    pref.innerHTML = '<option value="">全部都道府縣</option>' + DATA.prefs.map((p) => '<option value="' + p.code + '">' + p.zh + "</option>").join("");
    document.getElementById("cats").innerHTML = DATA.groups.map((c) => '<button type="button" class="chip" data-cat="' + c.id + '">' + c.zh + "</button>").join("");
    document.getElementById("brands").innerHTML = DATA.brands.map((b) => '<button type="button" class="chip" data-brand="' + b.id + '">' + b.zh + "</button>").join("");

    function render() {
      const now = jst(new Date());
      document.getElementById("clock").textContent = now.label;
      const rows = DATA.stores.filter((store) => match(store, now));
      document.getElementById("shown").textContent = String(rows.length);
      const hint = document.getElementById("hint");
      hint.classList.add("hidden");
      hint.textContent = "";
      if (state.brands.size === 1) {
        const only = brands[[...state.brands][0]];
        if (only && only.id !== "yodobashi") {
          hint.classList.remove("hidden");
          const note = document.createElement("p");
          note.textContent = only.zh + " 名冊不是全國每一間。其餘分店看日本 Google 地圖。";
          const link = document.createElement("a");
          link.href = japanQuery(only, state.pref);
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = "日本 Google 地圖";
          hint.append(note, link);
        }
      }
      const groups = new Map();
      for (const store of rows) {
        if (!groups.has(store.prefCode)) groups.set(store.prefCode, []);
        groups.get(store.prefCode).push(store);
      }
      const codes = [...groups.keys()].sort();
      list.innerHTML = codes.length ? "" : "<p>沒有符合的店。</p>";
      for (const code of codes) {
        const h = document.createElement("h2");
        h.textContent = prefs[code] || code;
        list.appendChild(h);
        for (const store of groups.get(code)) {
          const row = document.createElement("div");
          row.className = "store";
          const tone = toneOf(store);
          const mark = document.createElement("span");
          mark.className = "mark mark-" + tone;
          mark.textContent = letters(store);
          const button = document.createElement("button");
          button.type = "button";
          button.style.flex = "1";
          button.style.minWidth = "0";
          button.style.background = "transparent";
          button.style.border = "0";
          button.style.textAlign = "left";
          button.style.color = "inherit";
          button.style.padding = "0";
          const status = openState(store.hours, now);
          button.innerHTML = '<div class="meta"></div><div class="name"></div><div class="meta zh"></div><div class="meta hours"></div>';
          button.querySelector(".meta").textContent = (catLabel[(brands[store.brandId] || {}).category] || "") + " · " + brandName(store) + " / " + (store.city || "") + (favs.has(store.id) ? " · 最愛" : "");
          button.querySelector(".name").textContent = store.nameJa;
          button.querySelector(".name").classList.add("tone-" + tone);
          button.querySelector(".zh").textContent = store.nameZh;
          const hoursEl = button.querySelector(".hours");
          hoursEl.textContent = summary(store.hours);
          if (status === "open" || status === "closed") {
            const flag = document.createElement("span");
            flag.className = status === "open" ? "open" : "closed";
            flag.textContent = status === "open" ? " · 營業中" : " · 休息中";
            hoursEl.appendChild(flag);
          }
          button.addEventListener("click", () => openSheet(store, now));
          const fav = document.createElement("button");
          fav.type = "button";
          fav.className = "fav" + (favs.has(store.id) ? " on" : "");
          fav.textContent = favs.has(store.id) ? "已存" : "最愛";
          fav.addEventListener("click", () => {
            favs.has(store.id) ? favs.delete(store.id) : favs.add(store.id);
            saveFavs();
            render();
          });
          row.append(mark, button, fav);
          list.appendChild(row);
        }
      }
    }
    function openSheet(store, now) {
      const status = openState(store.hours, now);
      const link = source(store);
      sheet.classList.remove("hidden");
      sheet.innerHTML = "";
      const panel = document.createElement("div");
      panel.className = "panel";
      panel.innerHTML = '<button type="button" id="close">關閉</button><p class="meta"></p><h2></h2><p class="meta zh"></p><p class="addr"></p><p class="hours"></p><p class="note"></p><div class="links"></div>';
      panel.querySelector(".meta").textContent = (prefs[store.prefCode] || "") + " · " + brandName(store);
      panel.querySelector("h2").textContent = store.nameJa;
      panel.querySelector(".zh").textContent = store.nameZh;
      panel.querySelector(".addr").textContent = (store.postal ? "〒" + store.postal + " " : "") + store.address + (store.station ? " · " + store.station : "");
      const hoursEl = panel.querySelector(".hours");
      hoursEl.textContent = summary(store.hours) + (store.hoursNote ? " " + store.hoursNote : "");
      if (status === "open" || status === "closed") {
        const flag = document.createElement("span");
        flag.className = status === "open" ? "open" : "closed";
        flag.textContent = status === "open" ? " · 營業中" : " · 休息中";
        hoursEl.appendChild(flag);
      }
      panel.querySelector(".note").textContent = store.notice || "";
      const links = panel.querySelector(".links");
      const map = document.createElement("a");
      map.className = "primary";
      map.href = maps(store);
      map.target = "_blank";
      map.rel = "noreferrer";
      map.textContent = "日本 Google 地圖";
      links.appendChild(map);
      if (brands[store.brandId] && store.brandId !== "yodobashi") {
        const more = document.createElement("a");
        more.href = japanQuery(brands[store.brandId], store.prefCode);
        more.target = "_blank";
        more.rel = "noreferrer";
        more.textContent = "同品牌其他店 · 日本 Google 地圖";
        links.appendChild(more);
      }
      if (link) {
        const official = document.createElement("a");
        official.href = link;
        official.target = "_blank";
        official.rel = "noreferrer";
        official.textContent = "官網分店列表";
        links.appendChild(official);
      }
      sheet.appendChild(panel);
      sheet.addEventListener("click", (event) => { if (event.target === sheet) sheet.classList.add("hidden"); }, { once: true });
      panel.querySelector("#close").addEventListener("click", () => sheet.classList.add("hidden"));
    }
    q.addEventListener("input", () => { state.q = q.value.trim().toLowerCase(); render(); });
    pref.addEventListener("change", () => { state.pref = pref.value; render(); });
    document.getElementById("open").addEventListener("click", (event) => {
      state.open = !state.open;
      event.currentTarget.classList.toggle("on", state.open);
      render();
    });
    document.getElementById("saved").addEventListener("click", (event) => {
      state.saved = !state.saved;
      event.currentTarget.classList.toggle("on", state.saved);
      render();
    });
    document.body.addEventListener("click", (event) => {
      const cat = event.target.closest("[data-cat]");
      const brand = event.target.closest("[data-brand]");
      if (cat) {
        const id = cat.getAttribute("data-cat");
        state.cats.has(id) ? state.cats.delete(id) : state.cats.add(id);
        cat.classList.toggle("on", state.cats.has(id));
        render();
      }
      if (brand) {
        const id = brand.getAttribute("data-brand");
        state.brands.has(id) ? state.brands.delete(id) : state.brands.add(id);
        brand.classList.toggle("on", state.brands.has(id));
        render();
      }
    });
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem("joukyucho-theme", theme); } catch (e) {}
      document.getElementById("mode-light").classList.toggle("on", theme !== "dark");
      document.getElementById("mode-dark").classList.toggle("on", theme === "dark");
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#141414" : "#ffffff");
    }
    document.getElementById("mode-light").addEventListener("click", () => applyTheme("light"));
    document.getElementById("mode-dark").addEventListener("click", () => applyTheme("dark"));
    try { applyTheme(localStorage.getItem("joukyucho-theme") === "dark" ? "dark" : "light"); } catch (e) { applyTheme("light"); }
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") sheet.classList.add("hidden"); });
    render();
  </script>
</body>
</html>
